name: Build APK

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Optional backend config. Leave the secrets unset to build an offline-only app.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SEPARATION_API_URL: ${{ secrets.SEPARATION_API_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      # Platform glue the repo does not commit (gradle files, icons, wrapper) is
      # generated from the current Flutter template, then patched for this app.
      # `flutter create` never overwrites files that already exist.
      - name: Generate and patch Android platform files
        run: |
          flutter create . --platforms=android --org com.andymarrow --project-name unsung
          python3 tool/patch_android.py

      - run: flutter pub get

      # Formatting is enforced by fixing it: on PR branches the formatted code
      # is committed back, and this run continues on the formatted tree.
      - name: Format
        run: |
          dart format lib test
          if ! git diff --quiet -- lib test; then
            git --no-pager diff --stat -- lib test
            if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add lib test
              git commit -m "style: dart format"
              git push origin HEAD:${{ github.head_ref }}
            else
              echo "::error::Code is not formatted. Run dart format lib test."
              exit 1
            fi
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --exclude-tags golden

      # Golden tests render key screens with the real fonts in light and dark.
      # Rendered images are uploaded as review evidence.
      - name: Render screenshots (goldens)
        run: flutter test --tags golden --update-goldens

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            test/goldens/**/*.png
            test/**/failures/**
          if-no-files-found: ignore

      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=SEPARATION_API_URL="$SEPARATION_API_URL"
          ls -la build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: unsung-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
