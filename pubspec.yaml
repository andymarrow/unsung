name: unsung
description: Turn the songs on your phone into karaoke, sing, and share.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  http: ^1.2.2
  just_audio: ^0.9.42
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  record: ^6.0.0
  shared_preferences: ^2.3.3
  supabase_flutter: ^2.8.0
  youtube_explode_dart: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
